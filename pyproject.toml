[project]
name = "onyx-nextcloud-connector"
version = "0.1.0"
description = "Standalone Nextcloud -> Onyx sync bridge"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pypdf>=6.0",
    "python-docx>=1.2",
]

[project.scripts]
onyx-nextcloud-connector = "bridge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI endpoints use Depends() in argument defaults by design.
"onyx-patch/backend/**/*.py" = ["B008"]
[tool.ruff]
extend-exclude = [
    "onyx-patch/backend/onyx/configs/constants.py",
    "onyx-patch/backend/onyx/connectors/registry.py",
    "onyx-patch/backend/onyx/main.py",
]
line-length = 100
